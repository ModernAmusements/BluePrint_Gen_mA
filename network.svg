        <circle cx="-8" cy="0" r="8" stroke="#000" stroke-width="1.5"/>
        <path d="M 12 0 H 44 M 34 -9 L 44 0 L 34 9" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
