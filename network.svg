      <text x="0" y="20" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">EDGE-01</text>
      <text x="0" y="37" text-anchor="middle" font-size="8" fill-opacity="0.5">203.0.113.1 / 30</text>
    </g>
  </g>

  <g transform="translate(750,428)">
