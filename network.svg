      <circle cx="66" cy="-36" r="2.2" fill="#000" class="blink" style="animation-delay:.5s"/>
      <circle cx="66" cy="-27" r="2.2" stroke="#000" stroke-width="0.9" stroke-opacity="0.5"/>
      <text x="0" y="20" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">EDGE-02</text>
