      <rect x="-85" y="-48" width="170" height="96" rx="2" stroke="#000" stroke-width="1.6"/>
      <g transform="translate(-2,-14)">
        <path d="M -52 -16 H -26 M -52 -2 H -26 M -52 12 H -26" stroke="#000" stroke-width="1.2" stroke-opacity="0.45"/>
        <circle cx="-8" cy="0" r="8" stroke="#000" stroke-width="1.5"/>
        <path d="M 12 0 H 44 M 34 -9 L 44 0 L 34 9" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
