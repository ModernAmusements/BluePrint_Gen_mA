<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="1" stroke-opacity="0.22"/>
    </pattern>
    <clipPath id="fwClip">
      <rect x="140" y="550" width="800" height="64" rx="1"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "SF Mono", Menlo, "Roboto Mono", monospace;
      fill: #000;
      user-select: none;
    }

    /* Draw-in: pathLength="1" normalises every stroke. */
    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 0.75s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .fade {
      opacity: 0;
      animation: fade 0.5s ease-out forwards;
    }
    @keyframes fade {
      to { opacity: 1; }
    }

    .card {
      opacity: 0;
      transform: scale(0.97);
      transform-box: fill-box;
      transform-origin: center;
      animation: cardIn 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* ---- Live network activity ---- */

    .flows {
      opacity: 0;
      animation: fade 0.6s 1.45s forwards;
    }
    .flow {
      stroke: #000;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-dasharray: 0.1 27.9;
      opacity: 0.6;
      animation: flow 0.85s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -28; }
    }

    .blink {
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }

    .scan {
      animation: scan 3.2s ease-in-out infinite alternate;
    }
    @keyframes scan {
      to { transform: translateX(772px); }
    }

    .packets {
      opacity: 0;
      animation: fade 0.5s 1.55s forwards;
    }
  </style>

  <!-- ============ HEADER ============ -->
  <g class="fade" style="animation-delay:.05s">
    <text x="80" y="100" font-size="11" letter-spacing="3">NETWORK INFRASTRUCTURE / 01</text>
    <text x="1000" y="100" text-anchor="end" font-size="9" letter-spacing="1.4"><tspan class="blink">●</tspan> STATUS 01</text>
    <text x="80" y="124" font-size="8.5" letter-spacing="2" fill-opacity="0.5">EDGE → CORE → WORKLOAD / ZERO TRUST</text>
    <text x="1000" y="124" text-anchor="end" font-size="8.5" letter-spacing="1.2" fill-opacity="0.5">99.982% UPTIME</text>
  </g>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#000" stroke-width="1.1" pathLength="1" class="draw" style="animation-delay:.02s"/>

  <!-- ============ INTERNET ============ -->
  <path
    d="M 464 265
       C 448 265 438 253 441 239
       C 444 225 457 217 470 219
