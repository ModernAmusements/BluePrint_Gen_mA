  <text x="540" y="300" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3" class="fade" style="animation-delay:.55s">INTERNET</text>
  <text x="540" y="318" text-anchor="middle" font-size="8.5" letter-spacing="1" fill-opacity="0.5" class="fade" style="animation-delay:.60s">AS64512 · 203.0.113.0/24</text>

  <!-- ============ LINKS: INTERNET → EDGE ============ -->
  <g stroke="#000" stroke-width="1.4">
    <path d="M 441 232 H 330 V 380" pathLength="1" class="draw" style="animation-delay:.25s"/>
    <path d="M 642 232 H 750 V 380" pathLength="1" class="draw" style="animation-delay:.30s"/>
