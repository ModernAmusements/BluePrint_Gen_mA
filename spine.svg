  <g class="fade" style="animation-delay:.95s" fill="#000">
    <circle cx="390" cy="420" r="2.2"/>
    <circle cx="690" cy="420" r="2.2"/>
    <circle cx="168" cy="580" r="2"/>
    <circle cx="192" cy="580" r="2"/>
    <circle cx="408" cy="580" r="2"/>
    <circle cx="432" cy="580" r="2"/>
    <circle cx="648" cy="580" r="2"/>
    <circle cx="672" cy="580" r="2"/>
    <circle cx="888" cy="580" r="2"/>
    <circle cx="912" cy="580" r="2"/>
    <circle cx="180" cy="890" r="2.2"/>
    <circle cx="420" cy="890" r="2.2"/>
    <circle cx="660" cy="890" r="2.2"/>
    <circle cx="900" cy="890" r="2.2"/>
  </g>

  <!-- FLOWS -->
  <g class="flows" fill="none">
    <path class="flow" d="M 390 420 V 500 H 168 V 580"/>
    <path class="flow" d="M 390 420 V 500 H 408 V 580"/>
    <path class="flow" d="M 390 420 V 500 H 648 V 580"/>
    <path class="flow" d="M 390 420 V 500 H 888 V 580"/>
    <path class="flow" d="M 690 420 V 530 H 192 V 580"/>
    <path class="flow" d="M 690 420 V 530 H 432 V 580"/>
    <path class="flow" d="M 690 420 V 530 H 672 V 580"/>
    <path class="flow" d="M 690 420 V 530 H 912 V 580"/>
    <path class="flow" d="M 180 670 V 890"/>
    <path class="flow" d="M 420 670 V 890"/>
    <path class="flow" d="M 660 670 V 890"/>
    <path class="flow" d="M 900 670 V 890"/>
    <path class="flow" d="M 180 890 V 670" style="animation-duration:1.2s; opacity:.3"/>
    <path class="flow" d="M 660 890 V 670" style="animation-duration:1.35s; opacity:.3"/>
  </g>

  <!-- PACKETS -->
  <g class="packets" fill="#000">
    <circle r="3.2"><animateMotion path="M 390 420 V 500 H 168 V 580" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 390 420 V 500 H 408 V 580" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 390 420 V 500 H 648 V 580" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 390 420 V 500 H 888 V 580" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 690 420 V 530 H 192 V 580" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 690 420 V 530 H 432 V 580" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 690 420 V 530 H 672 V 580" dur="3.0s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 690 420 V 530 H 912 V 580" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M 180 670 V 890" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M 420 670 V 890" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M 660 670 V 890" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M 900 670 V 890" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="2.8"><animateMotion path="M 180 890 V 670" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="2.8"><animateMotion path="M 660 890 V 670" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- METRICS -->
  <line x1="80" y1="1176" x2="1000" y2="1176" stroke="#000" stroke-width="1" stroke-dasharray="1 5" stroke-opacity="0.35" class="fade" style="animation-delay:1.30s"/>
  <g class="fade" style="animation-delay:1.38s">
    <text x="80" y="1218" font-size="20" font-weight="600">02</text>
    <text x="80" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">SPINES</text>
    <text x="320" y="1218" font-size="20" font-weight="600">04</text>
    <text x="320" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">LEAVES</text>
    <text x="600" y="1218" font-size="20" font-weight="600">0.18 ms</text>
    <text x="600" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">RTT / FABRIC</text>
    <text x="860" y="1218" font-size="20" font-weight="600">99.999%</text>
    <text x="860" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">UPTIME</text>
  </g>

  <!-- FOOTER -->
  <line x1="80" y1="1286" x2="1000" y2="1286" stroke="#000" stroke-width="1.1" pathLength="1" class="draw" style="animation-delay:1.44s"/>
  <g class="fade" style="animation-delay:1.50s">
    <circle cx="84" cy="1308" r="3" fill="#000"/>
    <text x="96" y="1312" font-size="8.5" letter-spacing="1.5">OPERATIONAL</text>
    <text x="540" y="1312" text-anchor="middle" font-size="8" letter-spacing="1.6" fill-opacity="0.45">SPINE-LEAF / EAST-WEST</text>
    <text x="1000" y="1312" text-anchor="end" font-size="8.5" letter-spacing="1.4" fill-opacity="0.55">REV 2.4 — 2026</text>
