      <text x="0" y="96" text-anchor="middle" font-size="8" fill-opacity="0.5">K8S · 12 PODS</text>
    </g>
  </g>

  <g transform="translate(420,890)">
    <g class="card" style="animation-delay:.90s">
      <rect x="-85" y="0" width="170" height="120" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="74" cy="14" r="2.2" fill="#000" class="blink" style="animation-delay:.5s"/>
      <g transform="translate(0,32)" stroke="#000">
        <ellipse cx="0" cy="-12" rx="18" ry="6" stroke-width="1.3"/>
        <path d="M -18 -12 V 12 A 18 6 0 0 0 18 12 V -12" stroke-width="1.3"/>
        <path d="M -18 -1 A 18 6 0 0 0 18 -1" stroke-width="1" stroke-opacity="0.5"/>
      </g>
      <text x="0" y="78" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.8">STORAGE</text>
      <text x="0" y="96" text-anchor="middle" font-size="8" fill-opacity="0.5">CEPH · 240 TB</text>
    </g>
  </g>

  <g transform="translate(660,890)">
    <g class="card" style="animation-delay:.95s">
      <rect x="-85" y="0" width="170" height="120" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="74" cy="14" r="2.2" fill="#000" class="blink" style="animation-delay:.8s"/>
      <g transform="translate(0,32)">
        <path d="M 0 -19 L 17 -10 V 10 L 0 19 L -17 10 V -10 Z" stroke="#000" stroke-width="1.3"/>
        <circle r="5" stroke="#000" stroke-width="1.1"/>
        <path d="M 0 -19 V -5 M 17 -10 L 5 -3 M -17 -10 L -5 -3 M 0 19 V 5 M 17 10 L 5 3 M -17 10 L -5 3" stroke="#000" stroke-width="0.8" stroke-opacity="0.5"/>
      </g>
      <text x="0" y="78" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.8">API</text>
      <text x="0" y="96" text-anchor="middle" font-size="8" fill-opacity="0.5">8 REPLICAS</text>
    </g>
  </g>

  <g transform="translate(900,890)">
    <g class="card" style="animation-delay:1.00s">
      <rect x="-85" y="0" width="170" height="120" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="74" cy="14" r="2.2" fill="#000" class="blink" style="animation-delay:.4s"/>
      <g transform="translate(0,32)" stroke="#000" stroke-width="1.3">
        <rect x="-20" y="-14" width="40" height="28" rx="1"/>
        <path d="M -20 -5 H 20"/>
        <rect x="-6" y="-11" width="12" height="4" rx="1"/>
      </g>
      <text x="0" y="78" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.8">DATA</text>
      <text x="0" y="96" text-anchor="middle" font-size="8" fill-opacity="0.5">S3 · 12 TB</text>
    </g>
