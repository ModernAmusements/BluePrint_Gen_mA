<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
  <style>
    text { font-family: "SF Mono", Menlo, "Roboto Mono", monospace; fill: #000; user-select: none; }

    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.75s cubic-bezier(0.25,0.8,0.25,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .fade { opacity: 0; animation: fade 0.5s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }

    .card { opacity: 0; transform: scale(0.97); transform-box: fill-box; transform-origin: center; animation: cardIn 0.6s cubic-bezier(0.2,0.7,0.2,1) forwards; }
    @keyframes cardIn { to { opacity: 1; transform: scale(1); } }

    .flows { opacity: 0; animation: fade 0.6s 1.35s forwards; }
    .flow { stroke: #000; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 0.1 27.9; opacity: 0.6; animation: flow 0.85s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }

    .packets { opacity: 0; animation: fade 0.5s 1.45s forwards; }
  </style>

  <!-- HEADER -->
  <g class="fade" style="animation-delay:.05s">
    <text x="80" y="100" font-size="11" letter-spacing="3">HUB / 03</text>
    <text x="1000" y="100" text-anchor="end" font-size="9" letter-spacing="1.4"><tspan class="blink">●</tspan> STATUS 01</text>
    <text x="80" y="124" font-size="8.5" letter-spacing="2" fill-opacity="0.5">STAR TOPOLOGY / CENTRAL SWITCH</text>
    <text x="1000" y="124" text-anchor="end" font-size="8.5" letter-spacing="1.2" fill-opacity="0.5">1 HUB · 6 SPOKES</text>
  </g>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#000" stroke-width="1.1" pathLength="1" class="draw" style="animation-delay:.02s"/>

  <!-- SPOKES -->
  <g stroke="#000" stroke-width="1.4">
    <path d="M 430 660 H 380 V 360 H 285" pathLength="1" class="draw" style="animation-delay:.20s"/>
    <path d="M 650 660 H 700 V 360 H 795" pathLength="1" class="draw" style="animation-delay:.25s"/>
    <path d="M 430 720 H 285" pathLength="1" class="draw" style="animation-delay:.30s"/>
    <path d="M 650 720 H 795" pathLength="1" class="draw" style="animation-delay:.35s"/>
    <path d="M 430 780 H 380 V 1080 H 285" pathLength="1" class="draw" style="animation-delay:.40s"/>
    <path d="M 650 780 H 700 V 1080 H 795" pathLength="1" class="draw" style="animation-delay:.45s"/>
  </g>

  <!-- HUB -->
  <g class="card" style="animation-delay:.35s">
    <rect x="430" y="610" width="220" height="220" rx="4" stroke="#000" stroke-width="2"/>
    <rect x="445" y="625" width="190" height="190" rx="2" stroke="#000" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.35"/>
    <path d="M 540 610 V 624 M 540 816 V 830 M 430 720 H 444 M 636 720 H 650" stroke="#000" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="540" y="714" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="5">HUB</text>
    <text x="540" y="738" text-anchor="middle" font-size="8" letter-spacing="2" fill-opacity="0.55">SW-CORE</text>
    <g fill="#000">
      <circle cx="516" cy="792" r="2.4" class="blink"/>
      <circle cx="532" cy="792" r="2.4" class="blink" style="animation-delay:.3s"/>
      <circle cx="548" cy="792" r="2.4" class="blink" style="animation-delay:.6s"/>
      <circle cx="564" cy="792" r="2.4" class="blink" style="animation-delay:.9s"/>
    </g>
  </g>

  <g class="fade" style="animation-delay:.90s" fill="#000">
    <circle cx="430" cy="660" r="2.2"/>
    <circle cx="650" cy="660" r="2.2"/>
    <circle cx="430" cy="720" r="2.2"/>
    <circle cx="650" cy="720" r="2.2"/>
    <circle cx="430" cy="780" r="2.2"/>
    <circle cx="650" cy="780" r="2.2"/>
  </g>

  <!-- LEAVES -->
  <g transform="translate(210,360)">
    <g class="card" style="animation-delay:.55s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">EDGE-A</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">203.0.113.1</text>
    </g>
  </g>

  <g transform="translate(870,360)">
    <g class="card" style="animation-delay:.60s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink" style="animation-delay:.3s"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">EDGE-B</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">203.0.113.2</text>
    </g>
  </g>

  <g transform="translate(210,720)">
    <g class="card" style="animation-delay:.65s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink" style="animation-delay:.6s"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">COMPUTE</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">K8S · 12 PODS</text>
    </g>
  </g>

  <g transform="translate(870,720)">
    <g class="card" style="animation-delay:.70s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink" style="animation-delay:.9s"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">STORAGE</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">CEPH · 240 TB</text>
    </g>
  </g>

  <g transform="translate(210,1080)">
    <g class="card" style="animation-delay:.75s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink" style="animation-delay:.2s"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">API</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">8 REPLICAS</text>
    </g>
  </g>

  <g transform="translate(870,1080)">
    <g class="card" style="animation-delay:.80s">
      <rect x="-75" y="-45" width="150" height="90" rx="2" stroke="#000" stroke-width="1.5"/>
      <circle cx="64" cy="-34" r="2.2" fill="#000" class="blink" style="animation-delay:.5s"/>
      <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2">BACKUP</text>
      <text x="0" y="14" text-anchor="middle" font-size="8" fill-opacity="0.5">S3 · 12 TB</text>
    </g>
  </g>

  <!-- FLOWS -->
  <g class="flows" fill="none">
    <path class="flow" d="M 430 660 H 380 V 360 H 285"/>
    <path class="flow" d="M 650 660 H 700 V 360 H 795"/>
    <path class="flow" d="M 430 720 H 285"/>
    <path class="flow" d="M 650 720 H 795"/>
    <path class="flow" d="M 430 780 H 380 V 1080 H 285"/>
    <path class="flow" d="M 650 780 H 700 V 1080 H 795"/>
    <path class="flow" d="M 285 720 H 430" style="animation-duration:1.2s; opacity:.3"/>
    <path class="flow" d="M 795 720 H 650" style="animation-duration:1.3s; opacity:.3"/>
  </g>

  <!-- PACKETS -->
  <g class="packets" fill="#000">
    <circle r="3.2"><animateMotion path="M 430 660 H 380 V 360 H 285" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 650 660 H 700 V 360 H 795" dur="3.0s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 430 720 H 285" dur="1.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 650 720 H 795" dur="2.0s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 430 780 H 380 V 1080 H 285" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M 650 780 H 700 V 1080 H 795" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="2.8"><animateMotion path="M 285 360 H 380 V 660 H 430" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="2.8"><animateMotion path="M 285 720 H 430" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="2.8"><animateMotion path="M 795 720 H 650" dur="2.4s" begin="0.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- METRICS -->
  <line x1="80" y1="1176" x2="1000" y2="1176" stroke="#000" stroke-width="1" stroke-dasharray="1 5" stroke-opacity="0.35" class="fade" style="animation-delay:1.30s"/>
  <g class="fade" style="animation-delay:1.38s">
    <text x="80" y="1218" font-size="20" font-weight="600">01</text>
    <text x="80" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">HUB</text>
    <text x="320" y="1218" font-size="20" font-weight="600">06</text>
    <text x="320" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">SPOKES</text>
    <text x="600" y="1218" font-size="20" font-weight="600">0.22 ms</text>
    <text x="600" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">RTT / HUB</text>
    <text x="860" y="1218" font-size="20" font-weight="600">99.99%</text>
    <text x="860" y="1237" font-size="8" letter-spacing="1.4" fill-opacity="0.5">UPTIME</text>
  </g>

  <!-- FOOTER -->
  <line x1="80" y1="1286" x2="1000" y2="1286" stroke="#000" stroke-width="1.1" pathLength="1" class="draw" style="animation-delay:1.44s"/>
  <g class="fade" style="animation-delay:1.50s">
    <circle cx="84" cy="1308" r="3" fill="#000"/>
    <text x="96" y="1312" font-size="8.5" letter-spacing="1.5">OPERATIONAL</text>
    <text x="540" y="1312" text-anchor="middle" font-size="8" letter-spacing="1.6" fill-opacity="0.45">HUB / STAR</text>
    <text x="1000" y="1312" text-anchor="end" font-size="8.5" letter-spacing="1.4" fill-opacity="0.55">REV 2.4 — 2026</text>
  </g>
</svg>
